[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rpa-orkestrai"
version = "0.7.3"
description = "Yerel masaüstü ve web otomasyonu için görsel RPA Studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "certifi>=2024.8.30",
  "cryptography>=44,<52",
  "packaging>=24,<27",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pandas>=2.3.3,<3",
  "SQLAlchemy>=2.0,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
automation = [
  "pyobjc-framework-Quartz>=12,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=12,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=12,<13; sys_platform == 'darwin'",
  "comtypes>=1.4.8,<2; sys_platform == 'win32'",
  "winrt-runtime>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
  "pyautogui>=0.9.54,<1",
  "pynput>=1.8,<2",
  "pyperclip>=1.9,<2",
  "opencv-python>=4.10,<5",
  "pytesseract>=0.3.13,<1",
  "Pillow>=12,<13",
  "gspread>=6.1,<7",
  "google-auth>=2.35,<3",
  "playwright>=1.49,<2",
  "psycopg[binary]>=3.2,<4",
  "pyodbc>=5.3,<6",
]
native = [
  "pywebview>=6.2,<7",
  "pythonnet>=3.1,<4; sys_platform == 'win32'",
]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
build = ["pyinstaller>=6.16,<7", "Pillow>=12,<13"]

[project.scripts]
rpa-studio = "rpa_orkestrai.cli:main"

[project.gui-scripts]
rpa-studio-gui = "rpa_orkestrai.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_orkestrai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["real_license: exercise the real license gate instead of the test stub"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
