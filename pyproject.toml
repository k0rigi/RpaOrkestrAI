[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rpa-orkestrai"
version = "0.1.0"
description = "Yerel masaüstü ve web otomasyonu için görsel RPA Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
automation = [
  "pyobjc-framework-Quartz>=10,<13; sys_platform == 'darwin'",
  "pyautogui>=0.9.54,<1",
  "pyperclip>=1.9,<2",
  "opencv-python>=4.10,<5",
  "pytesseract>=0.3.13,<1",
  "Pillow>=10.4,<13",
  "gspread>=6.1,<7",
  "google-auth>=2.35,<3",
  "playwright>=1.49,<2",
  "psycopg[binary]>=3.2,<4",
  "pyodbc>=5.2,<6",
]
native = ["pywebview>=5.3,<7"]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
build = ["pyinstaller>=6.16,<7", "Pillow>=10.4,<13"]

[project.scripts]
rpa-studio = "rpa_orkestrai.cli:main"

[project.gui-scripts]
rpa-studio-gui = "rpa_orkestrai.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_orkestrai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
