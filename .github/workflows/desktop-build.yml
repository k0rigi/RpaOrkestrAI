name: Build desktop apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Windows-x64
          - os: macos-latest
            artifact: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install macOS ODBC build dependency
        if: runner.os == 'macOS'
        run: brew install unixodbc
      - name: Install build dependencies
        run: python -m pip install ".[native,automation,build,dev]"
      - name: Check runtime dependency consistency
        run: python -m pip check
      - name: Validate source
        run: python -m pytest
      - name: Build console-free app
        run: python scripts/build_desktop.py
      - name: Check Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'build/package-check.json'
          $process = Start-Process -FilePath '.\dist\RpaOrkestrAI\RpaOrkestrAI.exe' -ArgumentList @('--self-test', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Package check timed out' }
          if ($process.ExitCode -ne 0) { throw 'Package check failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen) { throw 'Invalid package check result' }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from rpa_orkestrai import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" 'packaging\windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Check and package macOS application
        if: runner.os == 'macOS'
        run: |
          dist/RpaOrkestrAI.app/Contents/MacOS/RpaOrkestrAI --self-test "$PWD/build/package-check.json"
          python -c "import json; d=json.load(open('build/package-check.json')); assert d['ok'] and d['frozen']"
          python scripts/build_macos_dmg.py dist/RpaOrkestrAI.app "dist/RpaOrkestrAI-macOS-$(uname -m).dmg"
      - name: Check the silent update installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # An update must install without any setup window, and must leave an installation the
          # updater is allowed to replace next time (RpaOrkestrAI.exe beside unins000.exe).
          $installer = (Get-ChildItem 'dist\installer\*.exe' | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'silent-install'
          $log = Join-Path $env:RUNNER_TEMP 'silent-install.log'
          $process = Start-Process -FilePath $installer -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target", "/LOG=$log")
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw 'Silent installation timed out' }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "Silent installation failed with exit code $($process.ExitCode)"
          }
          $deadline = (Get-Date).AddSeconds(60)
          foreach ($name in 'RpaOrkestrAI.exe', 'unins000.exe') {
            $file = Join-Path $target $name
            while (-not (Test-Path $file) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            if (-not (Test-Path $file)) {
              if (Test-Path $log) { Get-Content $log -Tail 40 }
              throw "Missing after the silent installation: $name"
            }
          }
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RpaOrkestrAI-${{ matrix.artifact }}
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Upload macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: RpaOrkestrAI-${{ matrix.artifact }}
          path: dist/RpaOrkestrAI-macOS-*.dmg
          if-no-files-found: error
          retention-days: 1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-check-${{ matrix.artifact }}
          path: |
            build/package-check.json
            build/pyinstaller/RpaOrkestrAI/warn-RpaOrkestrAI.txt
          if-no-files-found: ignore
          retention-days: 1
