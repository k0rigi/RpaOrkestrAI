name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install macOS ODBC dependency
        if: runner.os == 'macOS'
        run: brew install unixodbc
      - name: Install desktop, automation and test dependencies
        run: python -m pip install -e ".[native,automation,dev]"
      - name: Check runtime dependency consistency
        run: python -m pip check
      - name: Load automation dependencies
        run: python -c "import pandas, cv2, pyautogui, pyodbc, psycopg, gspread, webview; from playwright.sync_api import sync_playwright"
      - name: Load Windows native renderer
        if: runner.os == 'Windows'
        run: python -c "import clr; clr.AddReference('System.Windows.Forms'); import webview.platforms.winforms"
      - name: Load Windows UI Automation
        if: runner.os == 'Windows'
        run: python -c "import comtypes.client; comtypes.client.GetModule('UIAutomationCore.dll'); from comtypes.gen import UIAutomationClient"
      - name: Load macOS native renderer
        if: runner.os == 'macOS'
        run: python -c "import AppKit, Quartz, WebKit; import webview.platforms.cocoa; import ApplicationServices"
      - name: Lint
        run: python -m ruff check .
      - name: Test without external accounts or desktop access
        run: python -m pytest
