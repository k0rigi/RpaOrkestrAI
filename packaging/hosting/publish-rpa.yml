name: Publish RpaOrkestrAI desktop downloads

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect, publish the verified desktop bundle, or prune every version but the current one
        type: choice
        options: [inspect, publish, prune]
        default: inspect
        required: true
      version:
        description: Stable application version, for example 0.8.0 (publish - the new version; prune - the current version to keep)
        type: string
        required: false
      bundle_url:
        description: Short-lived HTTPS release-assets.githubusercontent.com bundle URL
        type: string
        required: false
      bundle_sha256:
        description: SHA-256 of publish-bundle.tar.gz
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: rpa-desktop-static-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SSH client
        run: python -m pip install 'paramiko>=3.5,<5'
      - name: Inspect, publish or prune only the RpaOrkestrAI directory
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python .github/scripts/publish-rpa.py
